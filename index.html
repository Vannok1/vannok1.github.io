<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0603">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Пиво">
<meta name="description" content="Реалистичное пиво в телефоне: наклоняй — плещется, поднеси к губам — пей, потряси — пена.">
<title>Drink Beer Online</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="glass" aria-label="Стакан пива"></canvas>

  <div id="hud" class="hidden">
    <button id="btn-sound" class="chip" aria-label="Звук">🔊</button>
    <button id="btn-beer" class="chip chip-wide" aria-label="Сорт пива">Светлое</button>
    <span id="counter" class="chip chip-ghost" aria-live="polite"></span>
    <button id="btn-refill" class="chip" aria-label="Налить ещё">🍺</button>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="empty" class="hidden">
    <button id="btn-again" class="cta">Ещё по одной?</button>
    <p id="empty-hint">или встряхни телефон</p>
  </div>

  <div id="start">
    <div class="start-card">
      <div class="start-logo" aria-hidden="true">🍺</div>
      <h1>Drink Beer Online</h1>
      <p class="lead" id="lead">Самое настоящее пиво — прямо в телефоне</p>
      <button id="btn-start" class="cta">Налить пиво</button>
      <ul class="tips" id="tips">
        <li><b>Наклоняй</b> — пиво плещется и держит уровень</li>
        <li><b>Поднеси к губам</b> и наклони — пей до дна</li>
        <li><b>Потряси</b> — поднимется пена</li>
      </ul>
      <p class="fine" id="fine">На iPhone разреши доступ к «Движению и ориентации». Звук включён.</p>
    </div>
  </div>

  <div id="fatal" class="hidden"></div>
  <pre id="debug" class="hidden"></pre>
</div>
<noscript><p class="noscript">Для работы нужен JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
